[project]
name = "agentprobe"
version = "0.1.0"
description = "Enterprise AI Agent and Automated Evaluation Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
